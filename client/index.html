<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volumen</title>
    <link href="/src/style.css" rel="stylesheet" />
  </head>
  <body>
    <main>
      <div id="board">
        <div id="board-layer"></div>
        <div id="board-hint">Double click anywhere to add a card</div>
      </div>
      <div id="link-hint" hidden>
        Click another card to link it · Esc to give up
      </div>
      <div id="board-conflict" class="notice" hidden>
        This board was changed elsewhere; this page is no longer saving it.
        <button class="notice-reload">Reload</button>
      </div>
      <div id="board-lost" class="notice" hidden>
        The browser took this page's graphics away, so nothing is being drawn.
        <button class="notice-reload">Reload</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
